services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusbook}
      POSTGRES_USER: ${POSTGRES_USER:-campusbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusbook}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-campusbook} -d ${POSTGRES_DB:-campusbook}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  api:
    image: campusbook-api-runtime
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://campusbook:campusbook@postgres:5432/campusbook?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      ORDER_PENDING_EXPIRE_SECONDS: ${ORDER_PENDING_EXPIRE_SECONDS:-900}
      ACTIVITY_REGISTRATION_PENDING_TTL_MS: ${ACTIVITY_REGISTRATION_PENDING_TTL_MS:-300000}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@campusbook.top}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo123456}
      DEMO_USER_ROLE: ${DEMO_USER_ROLE:-student}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@campusbook.top}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123456}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-me-refresh-secret}
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:-replace-me-internal-job-token}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://campusbook.top,http://www.campusbook.top,https://campusbook.top,https://www.campusbook.top,http://localhost:5173}
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  worker:
    image: campusbook-api-runtime
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "api", "start:worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://campusbook:campusbook@postgres:5432/campusbook?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      ORDER_PENDING_EXPIRE_SECONDS: ${ORDER_PENDING_EXPIRE_SECONDS:-900}
      ACTIVITY_REGISTRATION_PENDING_TTL_MS: ${ACTIVITY_REGISTRATION_PENDING_TTL_MS:-300000}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@campusbook.top}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo123456}
      DEMO_USER_ROLE: ${DEMO_USER_ROLE:-student}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@campusbook.top}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123456}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-me-refresh-secret}
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:-replace-me-internal-job-token}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://campusbook.top,http://www.campusbook.top,https://campusbook.top,https://www.campusbook.top,http://localhost:5173}
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      CAMPUSBOOK_API_BASE_URL: ${CAMPUSBOOK_API_BASE_URL:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@campusbook.top}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo123456}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@campusbook.top}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123456}
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.runtime/certbot/www:/var/www/certbot:ro

volumes:
  postgres_data:
  redis_data:
